<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baseplate – Roblox physics test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8f0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 10px; top: 10px; padding: 8px 10px; border-radius: 6px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #fff; background: rgba(0,0,0,.45); pointer-events: none; white-space: pre;
    user-select: none;
  }
  #tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    transform-origin: 50% 100%;
    position: absolute; left: 0; top: 0; display: none; white-space: nowrap;
    width: 240px; height: 20px; margin: -22px 0 0 -120px; text-align: center; overflow: visible;
    font: 700 15px/20px "Courier Prime", "Courier New", monospace;
    -webkit-text-size-adjust: none; text-size-adjust: none; font-size-adjust: none;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 0 5px rgba(0,0,0,.8);
  }
  #board {
    position: fixed; right: 10px; top: 10px; width: 190px; border-radius: 6px; overflow: hidden;
    background: rgba(0,0,0,.4); color: #fff; font: 13px/1.4 system-ui, sans-serif; user-select: none;
  }
  #board .hd { display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(0,0,0,.35); font-weight: 600; }
  #rows { max-height: 55vh; overflow-y: auto; }
  #rows .row { padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rows .row.me { background: rgba(255,255,255,.14); font-weight: 600; }
  #namebox {
    position: fixed; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center;
    padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff;
    font: 12px system-ui, sans-serif;
  }
  #namebox input {
    width: 150px; padding: 4px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.35); color: #fff; font: 700 14px "Courier Prime", monospace; outline: none;
  }
  #namebox input:focus { border-color: #fff; }
  #namebox button { padding: 4px 10px; border: 0; border-radius: 4px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }
  #cross {
    position: fixed; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 1.5px rgba(0,0,0,.6);
    display: none; pointer-events: none;
  }
  #msg {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%);
    font: 600 22px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.6);
    display: none; pointer-events: none;
  }
  #gfx {
    position: fixed; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center;
    padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font: 12px system-ui, sans-serif; user-select: none;
  }
  #gfx button { width: 24px; height: 24px; border: 0; border-radius: 4px; background: rgba(255,255,255,.2); color: #fff; font-weight: 700; cursor: pointer; }
  #gfx button.on { background: #fff; color: #000; }
  #hotbar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; }
  #hotbar .slot { width: 56px; height: 56px; border-radius: 8px; background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.3);
    color: #fff; font: 11px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  #hotbar .slot.on { border-color: #fff; background: rgba(255,255,255,.25); }
  #bt { position: fixed; left: 10px; top: 50%; transform: translateY(-50%); width: 236px; display: none; padding: 8px 10px; border-radius: 6px;
    background: rgba(0,0,0,.65); color: #fff; font: 12px system-ui, sans-serif; user-select: none; }
  #bt label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
  #bt input[type=number] { width: 44px; } #bt select { width: 90px; }
  #bt button { padding: 4px 8px; border: 0; border-radius: 4px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }

  /* ---- in-game popups (login + body colours) ---- */
  .gpop { position: fixed; display: none; z-index: 20; padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,.74);
    color: #fff; font: 13px system-ui, sans-serif; user-select: none; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .gpop.open { display: block; }
  .gp-hd { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .gp-x { width: 24px; height: 24px; border: 0; border-radius: 4px; background: rgba(255,255,255,.2); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
  .gp-x:hover { background: rgba(255,255,255,.35); }
  #colors { right: 10px; top: 50%; transform: translateY(-50%); width: 232px; }
  #colParts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
  #colParts button { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 2px solid transparent; border-radius: 5px;
    background: rgba(255,255,255,.12); color: #fff; font: 12px system-ui, sans-serif; cursor: pointer; text-align: left; }
  #colParts button.on { border-color: #fff; background: rgba(255,255,255,.25); }
  #colParts .chip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.65); flex: none; }
  #colSwatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  #colSwatches .sw { aspect-ratio: 1; border-radius: 5px; border: 2px solid rgba(0,0,0,.35); cursor: pointer; }
  #colSwatches .sw:hover { border-color: rgba(255,255,255,.8); }
  #colSwatches .sw.on { border-color: #fff; box-shadow: 0 0 0 1px #000; }
  .gp-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; }
  .gp-row span { opacity: .8; }
  .gp-btn { padding: 4px 10px; border: 0; border-radius: 4px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }
  #auth { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 270px; }
  #auth .gp-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  #auth .gp-tabs button { flex: 1; padding: 5px 0; border: 0; border-radius: 4px; background: rgba(255,255,255,.15); color: #fff; font-weight: 600; cursor: pointer; }
  #auth .gp-tabs button.on { background: #fff; color: #000; }
  #auth input { display: block; box-sizing: border-box; width: 100%; margin: 0 0 6px; padding: 7px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.4); color: #fff; font: 14px system-ui, sans-serif; outline: none; user-select: text; }
  #auth input:focus { border-color: #fff; }
  #authMsg { min-height: 16px; margin: 2px 0 8px; font-size: 12px; line-height: 1.35; color: #cfe3ff; }
  #authMsg.err { color: #ff9c9c; }
  #authGo { width: 100%; padding: 8px 0; font-size: 14px; }
  #authGo:disabled { opacity: .55; cursor: default; }
  #authGuest { display: block; width: 100%; margin-top: 8px; padding: 4px 0; border: 0; background: none; color: rgba(255,255,255,.75); font: 12px system-ui, sans-serif; cursor: pointer; text-decoration: underline; }
  #acctWho { display: none; font: 700 14px "Courier Prime", monospace; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  #acctBtn { padding: 4px 10px; border: 0; border-radius: 4px; background: #fff; color: #000; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="tags"></div>
<div id="board"><div class="hd"><span>Players</span><span id="pcount">1</span></div><div id="rows"></div></div>
<div id="namebox"><label for="nameInput" id="nameLbl">Name</label><input id="nameInput" maxlength="20" autocomplete="off" spellcheck="false"><button id="nameBtn" type="button">Set</button><span id="acctWho"></span><button id="acctBtn" type="button">Log in</button></div>
<div id="gfx"><span>Graphics</span><button data-l="1">1</button><button data-l="2">2</button><button data-l="3">3</button><button data-l="4">4</button><button data-l="5">5</button></div>
<div id="hotbar"><div class="slot" id="slotBT"><span style="font-size:20px">&#128296;</span><span>1 &middot; BTools</span></div><div class="slot" id="slotCol"><span style="font-size:20px">&#127912;</span><span>2 &middot; Colors</span></div></div>
<div id="bt"><b>Build Tools</b>
  <div style="display:flex;gap:6px;margin:6px 0"><button id="btSpawn" type="button">Spawn Part</button><button id="btDel" type="button">Delete</button></div>
  <div id="btHint" style="opacity:.75">Click a part to select it</div>
  <div id="btProps" style="display:none">
    <div style="display:flex;gap:6px;margin:4px 0"><button id="btMove" type="button">Move</button><button id="btSize" type="button">Resize</button></div>
    <label>Shape <select id="btShape"><option>Block</option><option>Ball</option><option>Cylinder</option></select></label>
    <label>Size <span><input type="number" id="sx" step="0.5" min="0.2"> <input type="number" id="sy" step="0.5" min="0.2"> <input type="number" id="sz" step="0.5" min="0.2"></span></label>
    <label>Pos <span><input type="number" id="px" step="0.5"> <input type="number" id="py" step="0.5"> <input type="number" id="pz" step="0.5"></span></label>
    <label>Transparency <input type="range" id="btT" min="0" max="1" step="0.05"></label>
    <label>Color <input type="color" id="btC"></label>
    <label>Anchored <input type="checkbox" id="btA"></label>
    <label>CanCollide <input type="checkbox" id="btK"></label>
  </div></div>
<div id="colors" class="gpop">
  <div class="gp-hd"><span>Body Colors</span><button class="gp-x" id="colX" type="button" title="Close">&times;</button></div>
  <div id="colParts"></div>
  <div id="colSwatches"></div>
  <div class="gp-row"><button class="gp-btn" id="colReset" type="button">Reset</button><span id="colSave"></span></div>
</div>
<div id="auth" class="gpop">
  <div class="gp-hd"><span id="authTitle">Log in</span><button class="gp-x" id="authX" type="button" title="Close">&times;</button></div>
  <div class="gp-tabs"><button id="tabLogin" class="on" type="button">Log in</button><button id="tabSignup" type="button">Sign up</button></div>
  <input id="authUser" maxlength="20" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false">
  <input id="authPass" type="password" maxlength="72" placeholder="Password" autocomplete="current-password">
  <div id="authMsg"></div>
  <button class="gp-btn" id="authGo" type="button">Log in</button>
  <button id="authGuest" type="button">Play as guest</button>
</div>
<div id="cross"></div>
<div id="msg"></div>

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, depthTest: false,
    uniforms: { sunDir: { value: SUN_DIR } },
    vertexShader: "varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: [
      "varying vec3 vDir; uniform vec3 sunDir;",
      "void main(){",
      "  vec3 d = normalize(vDir);",
      "  float h = max(d.y, 0.0);",
      "  vec3 hor = vec3(0.78, 0.88, 0.98);",
      "  vec3 zen = vec3(0.27, 0.50, 0.90);",
      "  vec3 c = mix(hor, zen, pow(h, 0.55));",
      "  float s = pow(max(dot(d, sunDir), 0.0), 700.0);",
      "  c += vec3(1.0, 0.95, 0.8) * s * 1.5;",
      "  gl_FragColor = vec4(c, 1.0);",
      "}"
    ].join("\n"),
  })
);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

const solids = [];   // {minX,minY,minZ,maxX,maxY,maxZ}

function addSolid(cx, cy, cz, sx, sy, sz) {
  solids.push({
    minX: cx - sx / 2, maxX: cx + sx / 2,
    minY: cy - sy / 2, maxY: cy + sy / 2,
    minZ: cz - sz / 2, maxZ: cz + sz / 2,
  });
}

function studTexture(base, repeat, img) {
  const S = 128, cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const g = cv.getContext("2d");
  const lit = "#" + [1, 3, 5].map(k => Math.min(255, Math.round(parseInt(base.substr(k, 2), 16) * 1.3 + 30)).toString(16).padStart(2, "0")).join("");
  const draw = () => {
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    if (!img.naturalWidth) return;
    g.globalAlpha = 0.2; g.drawImage(img, 0, 0, S, S);            // faint shadow
    const c2 = document.createElement("canvas"); c2.width = c2.height = S;
    const h = c2.getContext("2d"); h.drawImage(img, 0, 0, S, S);
    h.globalCompositeOperation = "source-in"; h.fillStyle = lit; h.fillRect(0, 0, S, S);
    g.globalAlpha = 0.9; g.drawImage(c2, 0, 0); g.globalAlpha = 1;  // stud tinted a brighter shade of the part colour
  };
  draw();
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0] || repeat, repeat[1] || repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (!img.naturalWidth) img.addEventListener("load", () => { draw(); t.needsUpdate = true; });
  return t;
}

function makePart(sx, sy, sz, cx, cy, cz, color, topTex, botTex) {
  const plain = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0 });
  const top = topTex ? new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.6, metalness: 0 }) : plain;
  const bot = botTex ? new THREE.MeshStandardMaterial({ map: botTex, roughness: 0.6, metalness: 0 }) : plain;
  // BoxGeometry face order: +x, -x, +y, -y, +z, -z
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), [plain, plain, top, bot, plain, plain]);
  m.position.set(cx, cy, cz);
  m.receiveShadow = true;
  m.castShadow = true;
  scene.add(m);
  addSolid(cx, cy, cz, sx, sy, sz);
  return m;
}

const GEO_CACHE = {};
function partGeometry(name) {
  if (!GEO_CACHE[name]) {
    const d = MODEL_PARTS[name];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(d.pos), 3));
    geo.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(d.nor), 3));
    if (name === "Head") {   // head is a rounded cylinder: project the face straight onto its front half; the rest samples plain yellow
      const P = d.pos, N = d.nor, uv = new Float32Array(P.length / 3 * 2);
      for (let k = 0; k < P.length / 3; k++) {
        if (P[k * 3] > 0) { uv[k * 2] = (0.55 - P[k * 3 + 2]) / 1.1; uv[k * 2 + 1] = (P[k * 3 + 1] - 3.95) / 1.1; }
        else { uv[k * 2] = -1; uv[k * 2 + 1] = -1; }
      }
      geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    }
    geo.computeBoundingSphere();
    geo.computeBoundingBox();
    GEO_CACHE[name] = geo;
  }
  return GEO_CACHE[name];
}

// One avatar = group + rig (name -> pivot group; rotate .rotation.z to swing, + = forward)
const FACE_CV = document.createElement("canvas"); FACE_CV.width = FACE_CV.height = 256;
const FACE_TEX = new THREE.CanvasTexture(FACE_CV);
FACE_TEX.anisotropy = 4;
(function paintFace() {
  const g = FACE_CV.getContext("2d");
  g.clearRect(0, 0, 256, 256);
  if (IMG_FACE.naturalWidth) g.drawImage(IMG_FACE, 0, 0, 256, 256);
  else IMG_FACE.addEventListener("load", paintFace);
  FACE_TEX.needsUpdate = true;
})();
function faceify(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.faceMap = { value: FACE_TEX };
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vOP; varying vec2 vFU;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvOP = position; vFU = vec2((0.55 - position.z) / 1.1, (position.y - 3.95) / 1.1);");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vOP; varying vec2 vFU; uniform sampler2D faceMap;")
      .replace("#include <map_fragment>", "#include <map_fragment>\n{ vec4 fc = texture2D(faceMap, vFU); float fm = step(0.0, vOP.x) * step(0.0, vFU.x) * step(vFU.x, 1.0) * step(0.0, vFU.y) * step(vFU.y, 1.0); diffuseColor.rgb = mix(diffuseColor.rgb, fc.rgb, fc.a * fm); }");
  };
  mat.customProgramCacheKey = () => "headface";
}
const FF_MAT = new THREE.MeshBasicMaterial({ color: 0x55bbff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending,
  depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
function setFF(av, on) { for (const m of av.ff) m.visible = on; }

function createAvatar() {
  const group = new THREE.Group();
  const rig = {}, ff = [];
  for (const name of Object.keys(MODEL_PARTS)) {
    const d = MODEL_PARTS[name];
    const mesh = new THREE.Mesh(partGeometry(name), new THREE.MeshStandardMaterial({
      color: PART_STYLE[name] || 0xcccccc, roughness: 0.55, metalness: 0,
    }));
    mesh.castShadow = true;
    if (name === "Head") faceify(mesh.material);
    const pivot = new THREE.Group();
    pivot.position.set(d.pivot[0], d.pivot[1], d.pivot[2]);
    pivot.add(mesh);
    const ffm = new THREE.Mesh(partGeometry(name), FF_MAT);
    ffm.visible = false; ffm.renderOrder = 2;
    pivot.add(ffm); ff.push(ffm);
    group.add(pivot);
    rig[name] = pivot;
  }
  return { group, rig, ff, facing: Math.PI / 2, ang: { LeftArm: 0, RightArm: 0, LeftLeg: 0, RightLeg: 0 } };
}

function cleanName(s) {
  return String(s == null ? "" : s).replace(/[\u0000-\u001f\u007f<>]/g, "").trim().slice(0, 20);
}

function addPlayer(id, name, local) {
  const avatar = local ? localAvatar : createAvatar();
  if (!local) { avatar.group.visible = false; scene.add(avatar.group); }
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = name;
  tagsEl.appendChild(tag);
  const pl = { id, name, avatar, tag, local, target: null, alive: true };
  players.set(id, pl);
  renderBoard();
  return pl;
}
function removePlayer(id) {
  const pl = players.get(id);
  if (!pl || pl.local) return;
  pl.tag.remove();
  scene.remove(pl.avatar.group);
  clearDebris(id);
  players.delete(id);
  renderBoard();
}
function renderBoard() {
  rowsEl.textContent = "";
  for (const pl of players.values()) {
    const row = document.createElement("div");
    row.className = "row" + (pl.local ? " me" : "");
    row.textContent = pl.name;
    rowsEl.appendChild(row);
  }
  countEl.textContent = String(players.size);
}

/* =====================================================================
   Multiplayer client (talks to server.js over WebSocket)
   Client-authoritative: every client simulates itself and broadcasts its
   state; the server only relays.
   ===================================================================== */
const NET = {
  url: "", ws: null, id: null, status: "offline", retry: 0, timer: 0, idle: 0, lastSig: "",

  channel: null, interval: 0,

function resolveServerUrl() {

  if (q) return q;

function netSend(o) {

let _sb = null;     // one client shared by login (auth + database) and multiplayer (realtime)

    .on("broadcast", { event: "s" }, ({ payload }) => {
      if (payload && payload.id && payload.id !== NET.id) remoteState(String(payload.id), payload);
    })
    .on("broadcast", { event: "died" }, ({ payload }) => {
      if (payload && payload.id && payload.id !== NET.id) remoteDied(String(payload.id));

    if (!pl) remoteJoin({ id: key, name: meta.name });
    else {
      const n = cleanName(meta.name);
      if (n && n !== pl.name) { pl.name = n; pl.tag.textContent = n; renderBoard(); }

  try { ws = new WebSocket(NET.url); } catch (_) { NET.status = "offline – retrying"; netRetry(); return; }
  NET.ws = ws; NET.status = "connecting…";
  ws.onopen = () => { NET.status = "online"; NET.retry = 0; netSend({ t: "join", name: myName, colors: myColors }); };

    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }

  };

    case "join": remoteJoin(m); break;
    case "leave": removePlayer(String(m.id)); break;
    case "name": {
      const pl = players.get(String(m.id));
      if (pl && !pl.local) { pl.name = cleanName(m.name) || pl.name; pl.tag.textContent = pl.name; renderBoard(); }
      break;
    }

function updateRemotes(dt) {
  const k = 1 - Math.exp(-dt * 18);

    if (!t || !pl.alive) { av.group.visible = false; continue; }

    setFF(av, !!t.ff);

    g.x += (t.x - g.x) * k; g.y += (t.y - g.y) * k; g.z += (t.z - g.z) * k;

      const n = LIMBS[i];

/* =====================================================================
   Camera state (Roblox-style orbit around the head)
   yaw = 0 looks toward -Z.  pitch > 0 looks down.
   ===================================================================== */
const cam = { yaw: 0, pitch: 0.2, zoom: CFG.CAM_ZOOM_START, zoomTarget: CFG.CAM_ZOOM_START, shift: 0 };

/* =====================================================================
   Player physics (fixed 240 Hz step)
   ===================================================================== */
const player = {
  pos: new THREE.Vector3().copy(SPAWN),
  prev: new THREE.Vector3().copy(SPAWN),
  vel: new THREE.Vector3(),
  onGround: false,
  alive: true,
  respawnTimer: 0,
  moveX: 0, moveZ: 0,        // last input direction (world), unit or zero
  ff: CFG.FF_TIME,           // spawn forcefield seconds left
  climb: null, climbReq: null, topExit: null, // ledge-climb state
  stepOff: 0,                // visual-only vertical offset that smooths ledge step-ups

function readMoveInput() {
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const rgt = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx =  Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  let mx = fx * fwd + rx * rgt, mz = fz * fwd + rz * rgt;
  const l = Math.hypot(mx, mz);

function approach(v, tx, tz, maxDelta) {
  const dx = tx - v.x, dz = tz - v.z, l = Math.hypot(dx, dz);
  if (l <= maxDelta || l === 0) { v.x = tx; v.z = tz; }
  else { v.x += dx / l * maxDelta; v.z += dz / l * maxDelta; }
}

function overlaps(p, b) {
  const h = CFG.CHAR_HALF_XZ;
  return p.x + h > b.minX && p.x - h < b.maxX &&
         p.z + h > b.minZ && p.z - h < b.maxZ &&
         p.y + CFG.CHAR_HEIGHT > b.minY && p.y < b.maxY;
}

function resolveHorizontal(axis, delta) {
  const p = player.pos, h = CFG.CHAR_HALF_XZ;
  for (const b of solids) {
    if (!overlaps(p, b)) continue;
    const rise = b.maxY - p.y;
    if ((player.onGround || player.vel.y > -10) && rise > 0 && rise <= CFG.STEP_HEIGHT + 1e-4) {
      player.stepOff -= (b.maxY - p.y); // physics snaps up, visuals ease up
      p.y = b.maxY;                    // walk up the ledge
      continue;
    }
    if (!player.onGround && !player.climb && !(player.noGrab > 0) && rise >= 3 && rise <= CFG.AUTOJUMP_MAX && (b.maxY - b.minY) <= CFG.CLIMB_MAX_SIZE && (player.moveX || player.moveZ)) {
      const dir = delta > 0 ? 1 : -1, t = { x: p.x, y: b.maxY, z: p.z };
      if (axis === "x") t.x = dir > 0 ? b.minX + h + 0.2 : b.maxX - h - 0.2; else t.z = dir > 0 ? b.minZ + h + 0.2 : b.maxZ - h - 0.2;
      if (axis === "x" ? (t.z > b.minZ - h * 0.5 && t.z < b.maxZ + h * 0.5) : (t.x > b.minX - h * 0.5 && t.x < b.maxX + h * 0.5)) {
        if (!solids.some(o => overlaps(t, o))) player.climbReq = { t, b, ax: axis === "x" ? dir : 0, az: axis === "z" ? dir : 0 };
      }
    }
    if (axis === "x") {
      if (delta > 0) p.x = b.minX - h; else p.x = b.maxX + h;
      player.vel.x = 0;
    } else {
      if (delta > 0) p.z = b.minZ - h; else p.z = b.maxZ + h;

function physicsStep(dt) {

    focus.x + cam.zoom * Math.sin(cam.yaw) * cp,
    focus.y + cam.zoom * sp,
    focus.z + cam.zoom * Math.cos(cam.yaw) * cp
  );
  // keep the camera above the baseplate (simple stand-in for Roblox's Popper)
  const MIN_Y = 0.25;
  if (desired.y < MIN_Y && focus.y > MIN_Y &&
      Math.abs(desired.x) < BASEPLATE_HALF && Math.abs(desired.z) < BASEPLATE_HALF) {
    const s = (focus.y - MIN_Y) / (focus.y - desired.y);
    desired.sub(focus).multiplyScalar(s).add(focus);
  }
  camera.position.copy(desired);
  camera.lookAt(focus);

  firstPerson = cam.zoom < 0.6;
  charGroup.visible = player.alive;
  rig.Head.visible = !firstPerson;               // first person: see your body, not the inside of your head
  crossEl.style.display = ((shiftLock || firstPerson) && player.alive) ? "block" : "none";
  if (!wantLock() && !rmbDown && document.pointerLockElement) document.exitPointerLock();
  lockTry += dt; if (lockTry > 0.4) { lockTry = 0; ensureLock(); }
  if (player.ff > 0) player.ff -= dt;
  FF_MAT.opacity = 0.32 + 0.14 * Math.sin(now / 90);
  setFF(localAvatar, player.alive && player.ff > 0 && (player.ff > 0.6 || Math.floor(player.ff * 12) % 2 === 0));

  updateRemotes(dt);
  if (selPart) selBox.setFromObject(selPart.mesh);
  updateGizmo();
  camera.updateMatrixWorld();
  updateTags();

  NET.timer += dt;
  if (NET.timer >= NET.interval) {
    NET.timer = 0;
    const r2 = v => Math.round(v * 100) / 100;
    const msg = { t: "s", x: r2(charGroup.position.x), y: r2(charGroup.position.y), z: r2(charGroup.position.z),
      f: r2(facing), a: [r2(ang.LeftArm), r2(ang.RightArm), r2(ang.LeftLeg), r2(ang.RightLeg)], al: player.alive ? 1 : 0, ff: player.ff > 0 ? 1 : 0 };
    const sig = JSON.stringify([msg.x, msg.y, msg.z, msg.f, msg.a, msg.al, msg.ff]);
    NET.idle += NET.interval;
    if (sig !== NET.lastSig || NET.idle >= 1) {      // idle players only send a 1 s heartbeat
      NET.lastSig = sig; NET.idle = 0;
      netSend(msg);
    }
  }

  // sun + shadow follow the player
  sun.position.set(tmp.x + SUN_DIR.x * 80, tmp.y + SUN_DIR.y * 80, tmp.z + SUN_DIR.z * 80);
  sun.target.position.copy(tmp);
  sky.position.copy(camera.position);

  if (GFX[gfxLevel].bloom && ensureComposer()) composer.render(dt); else renderer.render(scene, camera);

  // HUD
  hudTimer += dt;
  if (hudTimer > 0.1) {
    hudTimer = 0;
    const sp2 = Math.hypot(player.vel.x, player.vel.z);
    hud.textContent =
      "WASD move  Space jump  RMB-drag/arrows look  wheel zoom\nShift = shift lock   R = reset   Tab = player list   2 = body colors\n" +
      "state  " + (!player.alive ? "Dead" : player.onGround ? (sp2 > 0.5 ? "Running" : "Idle") : (player.vel.y > 0 ? "Jumping" : "Freefall")) + "\n" +
      "speed  " + sp2.toFixed(2) + " studs/s   vy " + player.vel.y.toFixed(1) + "\n" +
      "pos    " + player.pos.x.toFixed(1) + ", " + player.pos.y.toFixed(1) + ", " + player.pos.z.toFixed(1) + "\n" +
      "fps    " + Math.round(fps) + "  (physics " + CFG.PHYSICS_HZ + " Hz)\n" +
      "net    " + NET.status + (NET.err ? " [" + NET.err + "]" : "") + "  (" + players.size + " player" + (players.size === 1 ? "" : "s") + ")";
    msg.style.display = "none";
  }
}
/* =====================================================================
   Body colours (in-game popup) + account (login / saving)
   Colours are stored as { Head: "#rrggbb", Torso: ..., LeftArm, RightArm, LeftLeg, RightLeg }.
   Guests save to this device; logged-in players save to Supabase (CFG.SAVE_TABLE).
   ===================================================================== */
const PART_ORDER = ["Head", "Torso", "LeftArm", "RightArm", "LeftLeg", "RightLeg"];
const PART_LABEL = { Head: "Head", Torso: "Torso", LeftArm: "Left Arm", RightArm: "Right Arm", LeftLeg: "Left Leg", RightLeg: "Right Leg" };
const PALETTE = [
  "#f2f3f3", "#e5e4df", "#a3a2a5", "#635f62", "#1b2a35", "#0b0b0b",
  "#f8d9b8", "#e7b98f", "#cc8e69", "#a05f35", "#694028", "#4a2d1b",
  "#c4281c", "#da8541", "#f5cd30", "#a4bd47", "#4b974b", "#287f47",
  "#18b3ad", "#75c6f0", "#0d69ac", "#203a56", "#6b327c", "#a06bbf",
  "#e8bac8", "#ff66cc", "#cd6298", "#7b2e2f", "#9a5b2b", "#d7c59a",
];
const HEX_RE = /^#[0-9a-f]{6}$/i;
const GUEST_KEY = "bodyColors";
const DEFAULT_COLORS = {};
for (const n of PART_ORDER) DEFAULT_COLORS[n] = "#" + PART_STYLE[n].toString(16).padStart(6, "0");

function sanitizeColors(o) {
  const out = {};
  for (const n of PART_ORDER) out[n] = (o && typeof o[n] === "string" && HEX_RE.test(o[n])) ? o[n].toLowerCase() : DEFAULT_COLORS[n];
  return out;
}
function setAvatarColors(av, colors) {
  for (const n of PART_ORDER) { const pv = av.rig[n]; if (pv) pv.children[0].material.color.set(colors[n]); }
}
function applyRemoteColors(pl, colors) {
  if (!colors || typeof colors !== "object") return;
  const c = sanitizeColors(colors), sig = PART_ORDER.map(n => c[n]).join();
  if (pl.colorSig === sig) return;
  pl.colorSig = sig; setAvatarColors(pl.avatar, c);
}
function loadGuestColors() {
  try { return sanitizeColors(JSON.parse(localStorage.getItem(GUEST_KEY) || "null")); } catch (_) { return sanitizeColors(null); }
}
let myColors = loadGuestColors();
setAvatarColors(localAvatar, myColors);
function presenceInfo() { return { name: myName, colors: myColors }; }

const colEl = $("colors"), authEl = $("auth");
function uiOpen() { return colEl.classList.contains("open") || authEl.classList.contains("open"); }
function freeMouse() {                          // popups need a normal cursor: drop shift lock / pointer lock
  for (const k in keys) keys[k] = false;
  if (shiftLock) setShiftLock(false);
  if (document.pointerLockElement) document.exitPointerLock();
}

/* ---- body colour popup ---- */
let colPart = "Head", saveTimer = 0, netColT = 0;
function saveStatus(t) { $("colSave").textContent = t; }
(function buildColorsUI() {
  const parts = $("colParts"), sw = $("colSwatches");
  for (const n of PART_ORDER) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.p = n;
    b.innerHTML = '<span class="chip"></span><span>' + PART_LABEL[n] + "</span>";
    b.addEventListener("click", () => { colPart = n; refreshColorsUI(); });
    parts.appendChild(b);
  }
  for (const hex of PALETTE) {
    const d = document.createElement("div");
    d.className = "sw"; d.dataset.c = hex; d.style.background = hex; d.title = hex;
    d.addEventListener("click", () => setPartColor(colPart, hex));
    sw.appendChild(d);
  }
})();
function refreshColorsUI() {
  for (const b of $("colParts").children) {
    b.classList.toggle("on", b.dataset.p === colPart);
    b.firstChild.style.background = myColors[b.dataset.p];
  }
  for (const d of $("colSwatches").children) d.classList.toggle("on", d.dataset.c === myColors[colPart]);
}
function colorsChanged() {
  setAvatarColors(localAvatar, myColors);
  refreshColorsUI();
  clearTimeout(netColT);
  netColT = setTimeout(() => netSend({ t: "colors", colors: myColors }), 200);
  queueSave();
}
function setPartColor(n, hex) { myColors[n] = hex.toLowerCase(); colorsChanged(); }
function setMyColors(c) { myColors = c; setAvatarColors(localAvatar, myColors); refreshColorsUI(); netSend({ t: "colors", colors: myColors }); }
$("colReset").addEventListener("click", () => { myColors = sanitizeColors(null); colorsChanged(); });
function openColors() {
  freeMouse(); colEl.classList.add("open"); refreshColorsUI();
  saveStatus(acct.user ? "Saves to your account" : "Saves on this device (log in to keep it on your account)");
}
function closeColors() { colEl.classList.remove("open"); }
function toggleColors() { if (colEl.classList.contains("open")) closeColors(); else openColors(); }
$("colX").addEventListener("click", closeColors);
$("slotCol").addEventListener("click", toggleColors);

/* ---- saving ---- */
function queueSave() { saveStatus("Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 600); }
async function doSave() {
  saveTimer = 0;
  if (!acct.user) {
    try { localStorage.setItem(GUEST_KEY, JSON.stringify(myColors)); saveStatus("Saved on this device (log in to keep it on your account)"); }
    catch (_) { saveStatus("Couldn't save on this device"); }
    return;
  }
  const sb = getSB(); if (!sb) return;
  try {
    const { error } = await sb.from(CFG.SAVE_TABLE).upsert({ id: acct.user.id, username: acct.username, body_colors: myColors, updated_at: new Date().toISOString() });
    saveStatus(error ? "Couldn't save, try again" : "Saved to your account");
  } catch (_) { saveStatus("Couldn't save, try again"); }
}
async function flushSave() { if (saveTimer) { clearTimeout(saveTimer); await doSave(); } }

/* ---- account ---- */
const acct = { user: null, username: "", busy: false, mode: "login" };
let guestName = myName;
function setPlayerName(n) {
  myName = n; nameInput.value = n; me.name = n; me.tag.textContent = n;
  renderBoard(); netSend({ t: "name", name: n });
}
function acctUI() {
  const on = !!acct.user;
  for (const id of ["nameLbl", "nameInput", "nameBtn"]) $(id).style.display = on ? "none" : "";
  $("acctWho").style.display = on ? "block" : "none";
  $("acctWho").textContent = on ? acct.username : "";
  $("acctBtn").textContent = on ? "Log out" : "Log in";
}
async function onSignedIn(user) {
  const sb = getSB();
  acct.user = user;
  let username = (user.user_metadata && user.user_metadata.username) || String(user.email || "").split("@")[0];
  let loaded = false, failed = false;
  try {
    const { data, error } = await sb.from(CFG.SAVE_TABLE).select("username, body_colors").eq("id", user.id).maybeSingle();
    if (error) failed = true;
    else if (data) { loaded = true; username = data.username || username; setMyColors(sanitizeColors(data.body_colors)); }
  } catch (_) { failed = true; }
  acct.username = cleanName(username) || "Player";
  setPlayerName(acct.username);
  acctUI();
  if (failed) saveStatus("Couldn't load your save (is the SQL set up?)");
  else if (!loaded) { saveStatus("Saving…"); await doSave(); }      // brand-new account: keep the colours you already picked
}
async function logOut() {
  await flushSave();
  const sb = getSB();
  try { if (sb) await sb.auth.signOut({ scope: "local" }); } catch (_) {}
  acct.user = null; acct.username = "";
  setPlayerName(guestName);
  setMyColors(loadGuestColors());
  acctUI();
}

/* ---- login popup ---- */
const authUser = $("authUser"), authPass = $("authPass"), authGo = $("authGo");
function authMsg(t, err) { const m = $("authMsg"); m.textContent = t || ""; m.classList.toggle("err", !!err); }
function setAuthMode(mode) {
  acct.mode = mode;
  const su = mode === "signup";
  $("tabLogin").classList.toggle("on", !su); $("tabSignup").classList.toggle("on", su);
  $("authTitle").textContent = su ? "Create account" : "Log in";
  authGo.textContent = su ? "Create account" : "Log in";
  authPass.autocomplete = su ? "new-password" : "current-password";
  authMsg("");
}
function openAuth(mode) {
  freeMouse(); setAuthMode(mode || "login"); authEl.classList.add("open");
  setTimeout(() => authUser.focus(), 0);
}
function closeAuth() { authEl.classList.remove("open"); authUser.blur(); authPass.blur(); }
function friendlyAuthError(e, mode) {
  const msg = String(e && e.message || ""), code = String(e && e.code || "");
  if (code === "user_already_exists" || /already registered/i.test(msg)) return "That username is taken.";
  if (code === "invalid_credentials" || /invalid login/i.test(msg)) return "Wrong username or password.";
  if (code === "email_not_confirmed" || /not confirmed/i.test(msg)) return "Supabase is still asking for email confirmation. Turn off Confirm email in Authentication settings.";
  if (code === "over_request_rate_limit" || e.status === 429) return "Too many tries, wait a minute and try again.";
  if (code === "email_address_invalid" || /address .* is invalid/i.test(msg)) return "Supabase rejected the fake email domain. Set AUTH_EMAIL_DOMAIN in CFG to a domain that has MX records.";
  if (code === "weak_password") return msg || "Password is too weak.";
  return msg || (mode === "signup" ? "Couldn't create the account." : "Couldn't log in.");
}
async function submitAuth() {
  if (acct.busy) return;
  const sb = getSB();
  if (!sb) return authMsg("Supabase isn't set up yet. Put SUPABASE_URL and SUPABASE_ANON_KEY in CFG at the top of index.html.", true);
  const u = authUser.value.trim(), pw = authPass.value;
  if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return authMsg("Username: 3-20 letters, numbers or _", true);
  if (pw.length < 6) return authMsg("Password must be at least 6 characters.", true);
  acct.busy = true; authGo.disabled = true;
  authMsg(acct.mode === "signup" ? "Creating account…" : "Logging in…");
  const email = u.toLowerCase() + "@" + CFG.AUTH_EMAIL_DOMAIN;
  try {
    const res = acct.mode === "signup"
      ? await sb.auth.signUp({ email, password: pw, options: { data: { username: u } } })
      : await sb.auth.signInWithPassword({ email, password: pw });
    if (res.error) { authMsg(friendlyAuthError(res.error, acct.mode), true); return; }
    const user = res.data && res.data.user, session = res.data && res.data.session;
    if (!user || !session) { authMsg("Account made, but Supabase wants email confirmation. Turn off Confirm email in Authentication settings.", true); return; }
    authPass.value = "";
    await onSignedIn(user);
    closeAuth();
  } catch (_) { authMsg("Couldn't reach the server. Try again.", true); }
  finally { acct.busy = false; authGo.disabled = false; }
}
authGo.addEventListener("click", submitAuth);
$("tabLogin").addEventListener("click", () => setAuthMode("login"));
$("tabSignup").addEventListener("click", () => setAuthMode("signup"));
$("authX").addEventListener("click", closeAuth);
$("authGuest").addEventListener("click", closeAuth);
$("acctBtn").addEventListener("click", () => { if (acct.user) logOut(); else openAuth("login"); });
for (const el of [authUser, authPass]) el.addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Enter") submitAuth();
  else if (e.key === "Escape") closeAuth();
});
authUser.addEventListener("focus", () => { for (const k in keys) keys[k] = false; });
authPass.addEventListener("focus", () => { for (const k in keys) keys[k] = false; });

window.addEventListener("keydown", e => {
  if (isTyping() || e.repeat) return;
  if (e.code === "Digit2") toggleColors();
  else if (e.code === "Escape") { closeColors(); if (authEl.classList.contains("open")) closeAuth(); }
});

acctUI();
(async function initAuth() {            // restore a saved login, otherwise show the login popup once
  const sb = getSB();
  if (!sb) return;
  try {
    const { data } = await sb.auth.getUser();
    if (data && data.user) { await onSignedIn(data.user); return; }
  } catch (_) {}
  openAuth("login");
})();

netConnect();
requestAnimationFrame(frame);
</script>
