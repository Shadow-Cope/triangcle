[package]
name = "triancle-desktop"
version = "1.0.7"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
open = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
