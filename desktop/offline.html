<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Triangle</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: #120f09; color: #fff; font: 16px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 26px; } p { margin: 0 0 22px; color: #a79b80; }
  button { padding: 12px 26px; border: 0; border-radius: 10px; background: #ffbf2f; color: #1a1203; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #ffd25e; }
</style></head>
<body><div>
  <h1>Can't reach Triangle</h1>
  <p>Check your internet connection. We'll keep trying.</p>
  <button id="r" type="button">Try again</button>
</div>
<script>
  const go = () => { if (window.TriangleApp) window.TriangleApp.retry(); };
  document.getElementById("r").addEventListener("click", go);
  setInterval(go, 15000);
</script></body></html>
