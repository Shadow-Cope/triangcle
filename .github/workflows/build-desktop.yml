name: Build desktop app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            app: game
            script: dist:win
            file: desktop/dist/Triancle-Setup.exe
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            app: game
            script: dist:mac
            file: desktop/dist/Triancle-mac.dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            app: studio
            script: dist:studio:win
            file: desktop/dist/Triancle-Studio-Setup.exe
            rust_targets: x86_64-pc-windows-msvc
          - os: macos-latest
            app: studio
            script: dist:studio:mac
            file: desktop/dist/Triancle-Studio-mac.dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Check the update signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (see desktop/README.md, 'Auto-update')."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Point the app at your website
        if: ${{ vars.SITE_URL != '' }}
        shell: bash
        run: |
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("config.json","utf8"));c.siteUrl=process.env.SITE_URL||c.siteUrl;fs.writeFileSync("config.json",JSON.stringify(c,null,2))'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - run: npm run ${{ matrix.script }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: triancle-${{ matrix.app }}-${{ matrix.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error
      - name: Upload updater bundles
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.app }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.nsis.zip
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.sig
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Build update manifests
        run: node desktop/scripts/make-latest-json.cjs artifacts "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
